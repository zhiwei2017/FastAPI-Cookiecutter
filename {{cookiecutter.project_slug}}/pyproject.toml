[tool.poetry]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.short_description}}"
authors = [
  "{{cookiecutter.author}} <{{cookiecutter.email}}>",
]
readme = "README.rst"
repository = "{{cookiecutter.project_url}}"
documentation = "{{cookiecutter.project_url}}"
keywords = []
packages = [
  {include = "{{cookiecutter.project_slug}}"},
]
exclude = ["tests", "docs", "scripts"]


[tool.poetry.dependencies]
python = "^{{cookiecutter.python_version}}"
fastapi = "<1.0,>=0.103"
toml = "^0.10.2"
{%- if cookiecutter.use_database == "Yes" %}
psycopg2-binary = "<2.10,>=2.9"
sqlalchemy = "<2.1,>=2.0"
alembic = "<1.14,>=1.13"
{%- endif %}
pydantic = "<2.7,>=2.6"
pydantic-settings = ">=2.0,<3.0"
python-jose = "<3.4,>=3.3"
requests = "<2.32,>=2.31"
uvicorn = "<0.30,>=0.29"
{%- if cookiecutter.use_oauth == "Yes" %}
passlib = "<1.8,>=1.7"
python-multipart = "== 0.0.9"
bcrypt = "<4.2,>=4.1"
{%- endif %}

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
bandit = "^1.7"
mypy = "^1.6"
httpx = "<0.28,>=0.27"
pytest = "<8.2,>=8.1"
pytest-cov = "<5.1,>=5.0"
pytest-runner = "<6.1,>=6.0"
pytest-asyncio = "<0.24,>=0.23"
werkzeug = "<3.1,>=3.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "<7.3,>=7.2"
sphinx_rtd_theme = "<2.1,>=2.0"
m2r2 = "<0.4,>=0.3"

[build-system]
requires = ["poetry"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "toml.*",
  "click.*",
  "fastapi.*",
  "pydantic.*",
  "pydantic_settings.*",
  "starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "--verbose --exitfirst -p no:cacheprovider --cov-report term-missing --cov=./{{cookiecutter.project_slug}}"